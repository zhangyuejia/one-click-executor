# 命令执行根目录，此处可以为空，为空会被替换为 one-click-executor.dir
dir: D:\Projects\wms\wms2.0\#{[codeMode]}
# 日志错误关键词（判断是否命令是否成功执行）
errorLogWords: ["abort", "error", "fail", "unable", "Could not"]
# 启用替换id
enableRefId: [
      "wms2-dev",
]
enableAddItemIfNotExists: true
# 替换配置文件相对地址
filePaths: [
  wms2\base-server\gateway-server\src\main\resources\bootstrap.yml,
  wms2\microservices\admin-service\src\main\resources\bootstrap.yml,
  wms2\ui\web\src\main\resources\bootstrap.yml,
  wms2\microservices\wms-interface\src\main\resources\bootstrap.yml,
  wms2\webservice\wms-webservice\src\main\resources\bootstrap.yml,
  wms-service\microservices\wms-service\src\main\resources\bootstrap.yml,
  wms2\data-center-server\data-center-mdc\src\main\resources\bootstrap.yml,
  cmms-server\cmms-center\src\main\resources\bootstrap.yml
]
# 配置项map，优先级最高
propertiesMap: {
  "spring.config.location":"file:D:/zyj/resource/config/config_wms2/default/#{[configMode]}/${spring.application.name}.yaml,file:D:/zyj/resource/config/config_wms2/common/#{[configMode]}/common.yaml,file:D:/zyj/resource/config/config_wms2/rewrite/#{[configMode]}/${spring.application.name}.yaml",
 "nacosConfig.delayTime":1,
  "spring.cloud.nacos.discovery.watch-delay":2000
}
# 需要注释的配置项，优先级最高
uselessProperties: [
]
# 替换关键字描述
replaceKeys: [
  {
    # web环境配置
    refId: "wms2-dev",
    propertiesMap: {
    }
  }
]

